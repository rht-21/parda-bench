# Noisy templates: the text around entities is damaged at render time (OCR confusions, lost spaces, dropped
# punctuation), and the wording uses the misspellings and abbreviations people actually type.

[[template]]
id = "noisy-ocr-01"
lang = "en"
difficulty = "hard"
noisy = true
text = "GOVERNMENT OF INDIA Name: {name:upper} DOB: {dob:slashed} Aadhaar No: {aadhaar:spaced} VID: {vid:spaced}"

[[template]]
id = "noisy-ocr-02"
lang = "en"
difficulty = "hard"
noisy = true
text = "INCOME TAX DEPARTMENT Permanent Account Number {pan} Name {name:upper} Date of Birth {dob:slashed}"

[[template]]
id = "noisy-ocr-03"
lang = "en"
difficulty = "hard"
noisy = true
text = "TAX INVOICE Seller GSTIN: {gstin} Buyer: {name} Address: {address:latin} Mob: {phone:plain}"

