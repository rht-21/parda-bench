[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
parda-spec = { path = "crates/parda-spec" }
parda-data = { path = "crates/parda-data" }
parda-adapters = { path = "crates/parda-adapters" }
parda-eval = { path = "crates/parda-eval" }
parda-restore = { path = "crates/parda-restore" }
parda-report = { path = "crates/parda-report" }

anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
humantime = "2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
rand = "0.10"
rand_chacha = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "net", "sync", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
