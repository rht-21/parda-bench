name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The restore integration tests also start the in-repo reference tools with `uv run`.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest
      - name: Schema drift
        run: uv run parda-bench schema && git diff --exit-code spec/
      - name: Dataset drift
        # Fails if the generator now renders different samples for an already published version.
        run: |
          for version in data/v*; do
            uv run parda-bench data build --version "$(basename "$version")"
            uv run parda-bench data validate "$version"
          done
          git diff --exit-code data/

  python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --no-project python -m unittest discover -s sdk/python/tests
      - run: uv run --no-project python -m unittest discover -s tools/regex-baseline/tests
      - run: uv run --no-project python -m unittest discover -s tools/regex-proxy/tests
      - name: Type check
        # Presidio's environments are left out: they pull a 400 MB spaCy model.
        run: |
          (cd sdk/python && uvx mypy --strict src tests)
          for project in tools/regex-baseline tools/regex-proxy drivers/python; do
            (cd "$project" && uv run --frozen --with mypy mypy --strict .)
          done

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test
        working-directory: sdk/node
