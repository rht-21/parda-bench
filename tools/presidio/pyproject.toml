[project]
name = "parda-tool-presidio"
version = "0.1.0"
description = "Parda Bench adapter for Microsoft Presidio"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "parda-sdk",
    "presidio-analyzer==2.2.358",
    "presidio-anonymizer==2.2.358",
    "en-core-web-lg",
]

[tool.uv]
package = false

[tool.uv.sources]
parda-sdk = { path = "../../sdk/python", editable = true }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
