[project]
name = "regex-baseline"
version = "0.1.0"
description = "Parda Bench reference tool: regex and check-digit detection with reversible placeholders"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["parda-sdk"]

[tool.uv.sources]
parda-sdk = { path = "../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regex_baseline"]

[tool.mypy]
strict = true
