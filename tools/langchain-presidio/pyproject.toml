[project]
name = "parda-tool-langchain-presidio"
version = "0.1.0"
description = "Parda Bench adapter for LangChain's PresidioReversibleAnonymizer"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "parda-sdk",
    "langchain-experimental==0.4.2",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "faker==40.40.0",
    "en-core-web-lg",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.uv]
package = false

[tool.uv.sources]
parda-sdk = { path = "../../sdk/python", editable = true }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
