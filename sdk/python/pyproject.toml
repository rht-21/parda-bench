[project]
name = "parda-sdk"
version = "0.1.0"
description = "Helpers for writing Parda Bench tool adapters in Python"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parda_sdk"]

[tool.mypy]
strict = true
