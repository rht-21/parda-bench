id = "split-openai-first-char"
category = "streaming_split"
description = "Only the placeholder's first character ends a chunk, the hardest point to hold back."
api = "openai_chat"
stream = true
pii = ["+91 98765 43210"]
checks = ["no_leak_upstream", "restored_exact", "no_placeholder_fragment"]

