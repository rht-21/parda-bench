[project]
name = "parda-bench"
version = "0.2.0"
description = "Benchmark and restore test harness for Indian PII masking tools"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "aiohttp>=3.10"]

[project.scripts]
parda-bench = "parda_bench.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parda_bench"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tools", "drivers", "sdk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–", "…"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["tests/adapters/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
